# Publish a new version of your MCP server whenever you tag a release, and
# apply its policy first (its tests run on the release's tools).
# Copy to .github/workflows/ in your API's repository.
name: Publish MCP server

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  plugport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: plugport-ai/publish@v1
        with:
          key: ${{ secrets.PLUGPORT_KEY }}
          server: ${{ vars.PLUGPORT_SERVER }} # srv_…
          spec: openapi.yaml
          policy: plugport-policy.json # optional: the server's policy
