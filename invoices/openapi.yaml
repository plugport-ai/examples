openapi: 3.1.0
info:
  title: Acme Invoices
  version: "2.3.0"
  description: Create, find and send invoices.
servers:
  - url: https://api.acme.example/v1
security:
  - apiKey: []
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Invoice:
      type: object
      properties:
        id: { type: string, readOnly: true, example: inv_42 }
        customer: { type: string, description: The customer's ID. }
        amount: { type: integer, description: Total in cents. }
        currency: { type: string, enum: [usd, eur, gbp] }
        status: { type: string, enum: [draft, open, paid, void], readOnly: true }
        due: { type: string, format: date }
      required: [customer, amount, currency]
paths:
  /invoices:
    get:
      operationId: listInvoices
      summary: List invoices
      description: Newest first. Filter by customer or status; page with cursor.
      tags: [invoices]
      x-mcp:
        description: Find invoices. Filter by customer or status, newest first; pass next_cursor back as cursor for more.
        toolsets: [billing]
      parameters:
        - { name: customer, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [draft, open, paid, void] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: A page of invoices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Invoice" } }
                  next_cursor: { type: [string, "null"] }
    post:
      operationId: createInvoice
      summary: Create an invoice
      tags: [invoices]
      x-mcp:
        name: create_invoice
        toolsets: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Invoice" }
      responses:
        "201":
          description: The invoice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
  /invoices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getInvoice
      summary: Get an invoice
      tags: [invoices]
      x-mcp: { toolsets: [billing] }
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
    delete:
      operationId: deleteInvoice
      summary: Delete a draft invoice
      tags: [invoices]
      responses:
        "204": { description: Deleted. }
  /invoices/{id}/send:
    post:
      operationId: sendInvoice
      summary: Email an invoice to its customer
      tags: [invoices]
      x-mcp:
        title: Send invoice
        toolsets: [billing]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Sent. }
  /customers/{id}:
    get:
      operationId: getCustomer
      summary: Get a customer
      tags: [customers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  email: { type: string, format: email }
  /reports/legacy:
    get:
      operationId: legacyReport
      summary: Old revenue report
      deprecated: true
      tags: [reports]
      responses:
        "200": { description: The report. }
  /admin/customers/{id}/purge:
    x-mcp-exclude: true
    post:
      operationId: purgeCustomer
      summary: Erase a customer and all their data
      tags: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Erased. }
  /internal/metrics:
    get:
      operationId: internalMetrics
      summary: Service metrics
      tags: [internal]
      responses:
        "200": { description: Metrics. }
